[package]
name = "brainiac"
version = "0.1.0"
edition = "2024"
description = "Ranked, token-budgeted context for your repositories: CLI, TUI, and MCP server."
license = "MIT"
readme = "README.md"
repository = "https://github.com/oddurs/brainiac"
keywords = ["mcp", "context", "code-search", "tui", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
ignore = "0.4.33"
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"
