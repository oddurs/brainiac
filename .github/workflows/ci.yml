name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep the legs from evicting each other's cache.
          key: ${{ matrix.os }}
      # The suite shells out to git and asserts on commit ids, so it needs an
      # identity and a default branch name that do not depend on runner config.
      - name: configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - run: ./scripts/task check

  # Branch protection names this one status check, so jobs can be added freely.
  required:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.check.result }}" = "success" ] || exit 1
